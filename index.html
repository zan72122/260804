<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#87b6d9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="おおきな き を つちごと スポン と ぬいて、おひっこし するゲーム" />
<title>き の おひっこし — ツリースペード</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <!-- ===== ゲーム中 UI ===== -->
  <div id="ui" class="hidden">
    <div id="topbar">
      <button id="btn-menu" class="icon-btn" aria-label="メニュー">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div id="stepdots" aria-hidden="true"></div>
      <button id="btn-sound" class="icon-btn" aria-label="おと">
        <svg class="ic-on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="ic-off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M17 9.5l4 5M21 9.5l-4 5"/></svg>
      </button>
    </div>

    <div id="hint" class="hint hidden">
      <div class="hint-icon"><span class="finger"></span></div>
      <div class="hint-text"></div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <div id="dock"></div>
  </div>

  <!-- ===== オーバーレイ（タイトル・メニュー） ===== -->
  <div id="overlay" class="screen">
    <div class="screen-inner">
      <div id="screen-body"></div>
    </div>
  </div>

  <div id="loading">
    <div class="load-box">
      <div class="load-spade">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="load-text">よみこみちゅう…</div>
    </div>
  </div>

  <div id="fatal" class="hidden"></div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./src/main.js"></script>
<noscript><p style="color:#fff;padding:2em">このゲームには JavaScript が必要です。</p></noscript>
</body>
</html>
