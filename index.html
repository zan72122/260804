<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>きらきら ひょうぞうまつり</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>❄️</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body {
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", sans-serif;
    background: #0a1230;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* タイトル */
  #title {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4vmin;
    background: radial-gradient(ellipse at 50% 30%, rgba(140,190,255,0.25), rgba(10,20,60,0.55));
    z-index: 20;
  }
  #title h1 {
    color: #fff; font-size: clamp(28px, 8vmin, 64px); text-align: center; line-height: 1.3;
    text-shadow: 0 0 24px rgba(120,200,255,0.9), 0 4px 0 rgba(40,80,160,0.6);
    animation: floaty 3s ease-in-out infinite;
  }
  #title p { color: #cfe6ff; font-size: clamp(14px, 3.4vmin, 22px); text-shadow: 0 1px 6px rgba(0,0,40,0.8); }
  .chooseRow { display: flex; gap: 5vmin; flex-wrap: wrap; justify-content: center; }
  .chooseBtn {
    font-family: inherit; cursor: pointer; border: none;
    font-size: clamp(20px, 5vmin, 36px); padding: 3.4vmin 5vmin; border-radius: 32px;
    background: linear-gradient(180deg, #ffffff, #cfe6ff);
    color: #1c3f78; box-shadow: 0 8px 0 #7fa8d8, 0 14px 30px rgba(0,0,40,0.4);
    transition: transform 0.1s;
  }
  .chooseBtn:active { transform: translateY(6px); box-shadow: 0 2px 0 #7fa8d8; }
  .chooseBtn .big { font-size: clamp(44px, 11vmin, 84px); display: block; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.4vmin); } }

  /* バナー（指示） */
  #banner {
    position: fixed; top: max(2.5vmin, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.92); color: #1c3f78;
    font-size: clamp(18px, 4.6vmin, 30px); font-weight: bold;
    padding: 1.6vmin 4vmin; border-radius: 40px; text-align: center;
    box-shadow: 0 6px 20px rgba(0,20,60,0.35); z-index: 10; display: none;
    white-space: nowrap; max-width: 94vw; pointer-events: none;
  }
  #banner .sub { display: block; font-size: 0.62em; font-weight: normal; color: #4a6da8; }
  #banner.pop { animation: pop 0.4s ease; }
  @keyframes pop { 0% { transform: translateX(-50%) scale(0.6); } 70% { transform: translateX(-50%) scale(1.1); } 100% { transform: translateX(-50%) scale(1); } }

  /* メインボタン */
  #action {
    position: fixed; bottom: max(4vmin, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    font-family: inherit; cursor: pointer; border: none; display: none;
    font-size: clamp(22px, 5.6vmin, 38px); font-weight: bold;
    padding: 2.6vmin 7vmin; border-radius: 40px;
    background: linear-gradient(180deg, #ffe27a, #ffb340);
    color: #7a4a00; box-shadow: 0 7px 0 #cc8820, 0 12px 26px rgba(0,0,40,0.45);
    z-index: 10; transition: transform 0.1s; white-space: nowrap;
  }
  #action:active { transform: translateX(-50%) translateY(5px); box-shadow: 0 2px 0 #cc8820; }

  /* 進捗（星メーター） */
  #progressWrap {
    position: fixed; top: max(14vmin, calc(env(safe-area-inset-top) + 12vmin)); left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 2vmin; z-index: 10;
    background: rgba(20,40,90,0.55); border-radius: 30px; padding: 1.2vmin 3vmin;
    pointer-events: none;
  }
  #progressBar { width: clamp(140px, 36vmin, 300px); height: clamp(12px, 2.6vmin, 20px); background: rgba(255,255,255,0.25); border-radius: 20px; overflow: hidden; }
  #progressFill { height: 100%; width: 0%; border-radius: 20px; background: linear-gradient(90deg, #7ae0ff, #ffe27a); transition: width 0.25s; }
  #progressLabel { color: #fff; font-size: clamp(14px, 3.2vmin, 20px); font-weight: bold; white-space: nowrap; }
  #progressWrap::after { content: "⭐"; font-size: clamp(18px, 4vmin, 28px); }

  /* 回転ボタン */
  .rot {
    position: fixed; bottom: max(4vmin, env(safe-area-inset-bottom));
    width: clamp(56px, 13vmin, 92px); height: clamp(56px, 13vmin, 92px);
    border-radius: 50%; border: none; cursor: pointer; display: none;
    align-items: center; justify-content: center;
    font-size: clamp(26px, 6vmin, 44px);
    background: rgba(255,255,255,0.85); color: #1c3f78;
    box-shadow: 0 5px 0 #8fb0d8, 0 10px 20px rgba(0,0,40,0.35); z-index: 10;
  }
  .rot:active { transform: translateY(4px); box-shadow: 0 1px 0 #8fb0d8; }
  #rotL { left: max(3vmin, env(safe-area-inset-left)); }
  #rotR { right: max(3vmin, env(safe-area-inset-right)); }

  /* 大スイッチ */
  #bigSwitch {
    position: fixed; bottom: 12vmin; left: 50%; transform: translateX(-50%);
    width: clamp(120px, 30vmin, 220px); height: clamp(120px, 30vmin, 220px);
    border-radius: 50%; border: 10px solid #fff; cursor: pointer;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    font-family: inherit; font-size: clamp(18px, 4.4vmin, 30px); font-weight: bold;
    background: radial-gradient(circle at 50% 35%, #ff8a8a, #e03535);
    color: #fff; text-shadow: 0 2px 4px rgba(90,0,0,0.6);
    box-shadow: 0 10px 0 #a02020, 0 0 40px rgba(255,120,120,0.8), 0 16px 40px rgba(0,0,40,0.5);
    z-index: 10; animation: pulse 1.2s ease-in-out infinite;
  }
  #bigSwitch:active { transform: translateX(-50%) translateY(8px); box-shadow: 0 2px 0 #a02020; }
  @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }

  /* かんせい */
  #cheer {
    position: fixed; top: 8vmin; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: clamp(26px, 7vmin, 52px); font-weight: bold; display: none;
    text-shadow: 0 0 20px rgba(255,220,120,0.95), 0 0 44px rgba(160,120,255,0.9), 0 3px 0 rgba(60,20,120,0.7);
    z-index: 10; animation: cheer 1.6s ease-in-out infinite; white-space: nowrap; pointer-events: none;
  }
  #cheer.small { font-size: clamp(18px, 4.4vmin, 32px); top: max(2.5vmin, env(safe-area-inset-top)); }
  @keyframes cheer { 0%,100% { transform: translateX(-50%) scale(1) rotate(-2deg); } 50% { transform: translateX(-50%) scale(1.08) rotate(2deg); } }

  #replay {
    position: fixed; bottom: max(4vmin, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    font-family: inherit; cursor: pointer; border: none; display: none;
    font-size: clamp(18px, 4.4vmin, 30px); font-weight: bold;
    padding: 2vmin 6vmin; border-radius: 40px;
    background: linear-gradient(180deg, #b8f0ff, #6ec6ff); color: #123c6e;
    box-shadow: 0 6px 0 #3d84c4, 0 10px 24px rgba(0,0,40,0.4); z-index: 10;
  }
  #replay:active { transform: translateX(-50%) translateY(5px); box-shadow: 0 1px 0 #3d84c4; }

  #mute {
    position: fixed; top: max(2.5vmin, env(safe-area-inset-top)); right: max(2.5vmin, env(safe-area-inset-right));
    width: clamp(44px, 10vmin, 64px); height: clamp(44px, 10vmin, 64px); border-radius: 50%;
    border: none; cursor: pointer; font-size: clamp(20px, 5vmin, 30px);
    background: rgba(255,255,255,0.7); z-index: 11;
  }
</style>
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="banner"></div>
  <div id="progressWrap"><div id="progressBar"><div id="progressFill"></div></div><span id="progressLabel"></span></div>
  <button id="action"></button>
  <button id="rotL" class="rot">↺</button>
  <button id="rotR" class="rot">↻</button>
  <button id="bigSwitch"><span style="font-size:1.8em">💡</span>スイッチ！</button>
  <div id="cheer">✨ わぁ！ できたね！！ ✨</div>
  <button id="replay">🔁 もういちど あそぶ</button>
  <button id="mute">🔊</button>

  <div id="title">
    <h1>❄️ きらきら<br>ひょうぞうまつり ⛄</h1>
    <p>なにを つくる？</p>
    <div class="chooseRow">
      <button class="chooseBtn" id="chooseCastle"><span class="big">🏰</span>おしろ</button>
      <button class="chooseBtn" id="choosePenguin"><span class="big">🐧</span>ぺんぎん</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
