<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ぱてぃしえ だいすき！</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍰</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; position: fixed;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; background: #f2ddc4; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---- タイトル ---- */
  #title { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4vmin; z-index: 20;
    background: radial-gradient(circle at 50% 35%, rgba(255,240,225,0.55), rgba(255,205,180,0.25) 70%);
    transition: opacity 0.7s; }
  #title.hide { opacity: 0; pointer-events: none; }
  #title h1 { font-size: clamp(30px, 9vmin, 76px); color: #a1466b;
    text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(160,80,110,0.3);
    background: rgba(255,255,255,0.75); padding: 3vmin 6vmin; border-radius: 6vmin;
    border: 1vmin solid #ffc9d9; text-align: center; line-height: 1.3; }
  #title .sub { font-size: clamp(15px, 3.4vmin, 26px); color: #8a5a44;
    background: rgba(255,255,255,0.7); padding: 1.2vmin 3vmin; border-radius: 3vmin; }
  @keyframes bounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  /* ---- レシピ選択カード ---- */
  #recipeSelect { display: flex; flex-direction: row; flex-wrap: wrap; gap: 3.4vmin;
    justify-content: center; align-items: stretch; max-width: 94vw; }
  #recipeSelect button { display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1.2vmin; min-width: 24vmin;
    font-size: clamp(15px, 3.4vmin, 24px); font-weight: bold; line-height: 1.25;
    padding: 3vmin 3.6vmin; border: none; border-radius: 7vmin; color: #fff;
    font-family: inherit; text-align: center;
    background: linear-gradient(180deg, #ff9cb8, #f4658d);
    box-shadow: 0 8px 0 #c74a70, 0 12px 22px rgba(200,70,110,0.4);
    cursor: pointer; animation: bounce 1.6s ease-in-out infinite; }
  #recipeSelect button:active { transform: translateY(6px); box-shadow: 0 2px 0 #c74a70; }
  #recipeSelect .emoji { font-size: clamp(38px, 10vmin, 78px); }
  #recipeSelect button[data-recipe="glaze"] { background: linear-gradient(180deg, #9fd9ff, #4ea9e8);
    box-shadow: 0 8px 0 #2f7fb8, 0 12px 22px rgba(60,130,190,0.4); animation-delay: 0.2s; }
  #recipeSelect button[data-recipe="glaze"]:active { box-shadow: 0 2px 0 #2f7fb8; }
  #recipeSelect button[data-recipe="brulee"] { background: linear-gradient(180deg, #ffcf8a, #f5973c);
    box-shadow: 0 8px 0 #cf7a22, 0 12px 22px rgba(210,130,50,0.4); animation-delay: 0.4s; }
  #recipeSelect button[data-recipe="brulee"]:active { box-shadow: 0 2px 0 #cf7a22; }
  @media (orientation: portrait) { #recipeSelect { flex-direction: column; align-items: center; } }

  /* ---- ヒントバー ---- */
  #hintBar { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 2vmin);
    left: 50%; transform: translateX(-50%) scale(0.8); z-index: 10;
    background: rgba(255,255,255,0.92); border: 0.8vmin solid #ffd3e0;
    border-radius: 5vmin; padding: 1.6vmin 4vmin; display: flex; align-items: center; gap: 2vmin;
    box-shadow: 0 4px 14px rgba(180,100,130,0.25);
    opacity: 0; transition: opacity 0.4s, transform 0.4s; pointer-events: none;
    max-width: 92vw; }
  #hintBar.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #hintIcon { font-size: clamp(22px, 5.5vmin, 40px); }
  #hint { font-size: clamp(17px, 4.2vmin, 32px); color: #96455f; font-weight: bold; white-space: nowrap; }

  /* ---- 進捗バー ---- */
  #progress { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 13vmin);
    left: 50%; transform: translateX(-50%); width: min(52vmin, 300px); height: 3.4vmin; min-height: 16px;
    background: rgba(255,255,255,0.85); border: 0.6vmin solid #ffc9d9; border-radius: 3vmin;
    overflow: hidden; opacity: 0; transition: opacity 0.4s; z-index: 10; pointer-events: none; }
  #progress.show { opacity: 1; }
  #progressFill { height: 100%; width: 0; border-radius: 3vmin;
    background: linear-gradient(90deg, #ffd76e, #ff9cb8, #c39bf0);
    transition: width 0.15s linear; }

  /* ---- 完了バナー ---- */
  #banner { position: absolute; top: 42%; left: 50%; transform: translate(-50%,-50%) scale(0.5);
    font-size: clamp(26px, 8vmin, 64px); color: #fff; font-weight: bold; z-index: 15;
    text-shadow: 0 3px 0 #d96a92, 0 8px 18px rgba(150,50,90,0.5);
    background: linear-gradient(180deg, rgba(255,160,190,0.95), rgba(245,110,150,0.95));
    padding: 2.5vmin 6vmin; border-radius: 6vmin; border: 1vmin solid #fff;
    opacity: 0; transition: opacity 0.35s, transform 0.35s; pointer-events: none; white-space: nowrap; }
  #banner.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }

  /* ---- ゆびのヒント ---- */
  #finger { position: absolute; left: 50%; top: 55%; font-size: clamp(34px, 9vmin, 70px);
    z-index: 9; pointer-events: none; opacity: 0; transition: opacity 0.4s;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); }
  #finger.show { opacity: 0.9; }
  #finger.circle { animation: circleMove 1.8s linear infinite; }
  @keyframes circleMove {
    0%   { transform: translate(-50%,-50%) translate(9vmin, 0); }
    25%  { transform: translate(-50%,-50%) translate(0, 6vmin); }
    50%  { transform: translate(-50%,-50%) translate(-9vmin, 0); }
    75%  { transform: translate(-50%,-50%) translate(0, -6vmin); }
    100% { transform: translate(-50%,-50%) translate(9vmin, 0); }
  }
  #finger.hold { animation: holdTap 1.2s ease-in-out infinite; }
  @keyframes holdTap {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    35%,65% { transform: translate(-50%,-50%) scale(0.82); }
  }

  /* ---- ボタン共通 ---- */
  .bigBtn { position: absolute; z-index: 12; border: none; font-family: inherit; color: #fff;
    border-radius: 6vmin; cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity 0.4s, transform 0.15s; }
  .bigBtn.show { opacity: 1; pointer-events: auto; }
  .bigBtn:active { transform: scale(0.94); }

  .actionBtn { right: calc(env(safe-area-inset-right, 0px) + 3vmin);
    top: 42%;
    font-size: clamp(18px, 4.6vmin, 36px); padding: 2vmin 5vmin;
    background: linear-gradient(180deg, #86d9a8, #4cb87c);
    box-shadow: 0 5px 0 #38935f, 0 8px 16px rgba(60,150,100,0.4); }
  #replayBtn { left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 5vmin);
    font-size: clamp(20px, 5.4vmin, 42px); padding: 2.2vmin 7vmin;
    background: linear-gradient(180deg, #ffc46e, #f59b3c);
    box-shadow: 0 6px 0 #cf7a22, 0 10px 18px rgba(210,130,50,0.4); }
  #replayBtn.show { animation: bounce 1.6s ease-in-out infinite; }
  #replayBtn:active { transform: translateX(-50%) scale(0.94); }

  /* ---- トレイ共通（下部の選択バー: パレット・かざりトレイなど全レシピ共通） ---- */
  .trayBar { position: absolute; left: 50%; transform: translateX(-50%) translateY(4vmin);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 3vmin); z-index: 12;
    display: flex; gap: 2.2vmin; padding: 1.8vmin 2.6vmin;
    background: rgba(255,255,255,0.9); border: 0.8vmin solid #ffd3e0; border-radius: 6vmin;
    box-shadow: 0 6px 18px rgba(170,90,120,0.3);
    opacity: 0; pointer-events: none; transition: opacity 0.4s, transform 0.4s;
    max-width: 94vw; flex-wrap: wrap; justify-content: center; }
  .trayBar.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .trayBar button { width: clamp(50px, 12.5vmin, 88px); height: clamp(50px, 12.5vmin, 88px);
    border-radius: 3vmin; border: 0.7vmin solid #ffd3e0; background: #fff8fa;
    font-size: clamp(26px, 7vmin, 52px); cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
  .trayBar button:active { transform: scale(0.88); background: #ffeef3; }

  /* ---- クリーム色パレット（丸ボタン、trayBarを継承しつつ上書き） ---- */
  #palette button { width: clamp(52px, 13vmin, 92px); height: clamp(52px, 13vmin, 92px);
    border-radius: 50%; border: 1vmin solid #fff; cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2), inset 0 -1.5vmin 0 rgba(0,0,0,0.08);
    font-size: clamp(22px, 5.5vmin, 40px); }
  #palette button:active { transform: scale(0.9); }
  #palette [data-color="pink"]  { background: #ff9db8; }
  #palette [data-color="mint"]  { background: #9fe6c8; }
  #palette [data-color="sky"]   { background: #9fc8f0; }
  #palette [data-color="lemon"] { background: #ffe08a; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hintBar"><span id="hintIcon"></span><span id="hint"></span></div>
<div id="progress"><div id="progressFill"></div></div>
<div id="banner"></div>
<div id="finger">👆</div>

<div id="palette" class="trayBar">
  <button data-color="pink" aria-label="いちごクリーム">🍓</button>
  <button data-color="mint" aria-label="メロンクリーム">🍈</button>
  <button data-color="sky" aria-label="そらいろクリーム">💙</button>
  <button data-color="lemon" aria-label="レモンクリーム">🍋</button>
</div>

<div id="tray" class="trayBar">
  <button data-deco="strawberry" aria-label="いちご">🍓</button>
  <button data-deco="blueberry" aria-label="ブルーベリー">🫐</button>
  <button data-deco="orange" aria-label="オレンジ">🍊</button>
  <button data-deco="cookie" aria-label="クッキー">🍪</button>
  <button data-deco="candy" aria-label="ハートのあめ">💝</button>
  <button data-deco="candle" aria-label="ろうそく">🕯️</button>
</div>

<button id="doneBtn" class="bigBtn actionBtn">できた！ ✨</button>
<button id="replayBtn" class="bigBtn">もういちど あそぶ 🔁</button>

<div id="title">
  <h1>🧁 ぱてぃしえ<br>だいすき！ 🍰</h1>
  <div class="sub">レシピを えらんでね</div>
  <div id="recipeSelect">
    <button data-recipe="dome" aria-label="ひみつのドームケーキ"><span class="emoji">🍫</span>ひみつの<br>ドームケーキ</button>
    <button data-recipe="glaze" aria-label="かがみのケーキ"><span class="emoji">🪞</span>かがみの<br>ケーキ</button>
    <button data-recipe="brulee" aria-label="あぶってパリン！"><span class="emoji">🔥</span>あぶって<br>パリン！</button>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
