<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>はなかざり</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #241f2b;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  /* 文字なしローダー：花型のパルス */
  #loader {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #241f2b; z-index: 10; transition: opacity .6s ease; pointer-events: none;
  }
  #loader.gone { opacity: 0; }
  .bloom { width: 84px; height: 84px; position: relative; animation: spin 6s linear infinite; }
  .bloom span {
    position: absolute; left: 50%; top: 50%; width: 30px; height: 44px;
    margin: -38px 0 0 -15px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: #ff9cbe; transform-origin: 50% 38px; opacity: .9;
    animation: puls 1.4s ease-in-out infinite;
  }
  .bloom i {
    position: absolute; left: 50%; top: 50%; width: 26px; height: 26px;
    margin: -13px 0 0 -13px; border-radius: 50%; background: #ffd76e;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes puls { 0%,100% { transform: rotate(var(--r)) scale(1); } 50% { transform: rotate(var(--r)) scale(1.12); } }
</style>
</head>
<body>
<div id="app"></div>
<div id="loader">
  <div class="bloom">
    <span style="--r:0deg"></span><span style="--r:60deg"></span><span style="--r:120deg"></span>
    <span style="--r:180deg"></span><span style="--r:240deg"></span><span style="--r:300deg"></span>
    <i></i>
  </div>
</div>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
