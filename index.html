<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>ぴかぴかレールごう</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; position:fixed;
    background:#bfe6f7;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","BIZ UDGothic","IPAPGothic","Yu Gothic",sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #c { display:block; width:100%; height:100%; touch-action:none; }
  /* 擬音の吹き出し */
  #words { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .word {
    position:absolute; transform:translate(-50%,-50%);
    font-weight:800; white-space:nowrap; letter-spacing:.04em;
    color:#fff; -webkit-text-stroke:2px rgba(0,0,0,.001);
    text-shadow: 0 2px 0 rgba(0,0,0,.10),
      -2px 0 0 var(--oc), 2px 0 0 var(--oc), 0 -2px 0 var(--oc), 0 2px 0 var(--oc),
      -2px -2px 0 var(--oc), 2px -2px 0 var(--oc), -2px 2px 0 var(--oc), 2px 2px 0 var(--oc),
      0 6px 14px rgba(0,0,0,.18);
    animation: wordpop 1.7s cubic-bezier(.2,1.6,.4,1) forwards;
  }
  @keyframes wordpop {
    0%   { opacity:0; scale:.2; rotate:-6deg; }
    12%  { opacity:1; scale:1.15; rotate:3deg; }
    22%  { scale:.97; rotate:-1deg; }
    32%  { scale:1.03; rotate:0deg; }
    75%  { opacity:1; scale:1; }
    100% { opacity:0; scale:1.06; translate:0 -18px; }
  }
  .word.shiver { animation: wordpop 1.7s cubic-bezier(.2,1.6,.4,1) forwards, shiver .09s linear infinite; }
  @keyframes shiver { 0%{margin-left:0} 25%{margin-left:3px} 75%{margin-left:-3px} 100%{margin-left:0} }
  /* スタート画面 */
  #intro {
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4vmin; cursor:pointer;
    background:radial-gradient(120% 90% at 50% 18%, #fff7d9 0%, #ffe3ec 42%, #bfe6f7 100%);
    transition: opacity .5s ease; text-align:center;
  }
  #intro.hide { opacity:0; pointer-events:none; }
  #intro .train { font-size:16vmin; animation: chug 1.6s ease-in-out infinite; filter: drop-shadow(0 8px 10px rgba(120,80,0,.18)); }
  @keyframes chug { 0%,100%{ translate:0 0; rotate:-2deg } 50%{ translate:0 -2.2vmin; rotate:2deg } }
  #intro h1 {
    font-size:8.6vmin; color:#ff8fab; letter-spacing:.06em;
    text-shadow:0 3px 0 #fff, 0 8px 22px rgba(255,100,150,.35);
  }
  #intro .tap {
    font-size:4.6vmin; color:#5b8dbb; background:#ffffffd9; padding:2vmin 6vmin;
    border-radius:99px; box-shadow:0 6px 0 #cfe6f5; animation: tapPulse 1.2s ease-in-out infinite;
  }
  @keyframes tapPulse { 0%,100%{ scale:1 } 50%{ scale:1.08 } }
  #mute {
    position:fixed; z-index:9; top:calc(env(safe-area-inset-top, 0px) + 10px);
    right:calc(env(safe-area-inset-right, 0px) + 10px);
    width:44px; height:44px; border-radius:50%; border:none; font-size:22px;
    background:#ffffffb8; box-shadow:0 3px 0 rgba(140,170,190,.45); cursor:pointer;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="words"></div>
<button id="mute" aria-label="おと">🔊</button>
<div id="intro">
  <div class="train">🚃✨</div>
  <h1>ぴかぴかレールごう</h1>
  <div class="tap">タップして はじめる</div>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
