<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>よまつりの じゅんび</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#87b7e8;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", "Noto Sans JP", sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  /* ---- message banner ---- */
  #msg {
    position:fixed; top:max(10px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%) scale(0);
    background:rgba(255,252,240,0.94); color:#7a4a12; border:4px solid #ffb03a; border-radius:28px;
    padding:10px 22px; font-size:clamp(17px, 4.5vw, 26px); font-weight:800; white-space:normal;
    max-width:min(80vw, 620px); text-align:center;
    box-shadow:0 6px 18px rgba(80,40,0,0.25); transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none; z-index:10; letter-spacing:0.04em; }
  #msg.show { transform:translateX(-50%) scale(1); }
  /* ---- paint toolbar ---- */
  #paintbar { position:fixed; bottom:max(14px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    display:none; gap:clamp(8px,2.2vw,16px); z-index:10; align-items:center;
    background:rgba(255,252,240,0.92); border:4px solid #ffb03a; border-radius:60px;
    padding:10px clamp(12px,3vw,22px); box-shadow:0 6px 18px rgba(80,40,0,.25); }
  #paintbar.show { display:flex; }
  .colorBtn { width:clamp(46px,11vw,64px); height:clamp(46px,11vw,64px); border-radius:50%;
    border:4px solid #fff; box-shadow:0 3px 8px rgba(60,30,0,.3); padding:0; cursor:pointer; }
  .colorBtn.sel { outline:5px solid #ffd23a; transform:scale(1.12); }
  .stampBtn { width:clamp(52px,12.5vw,72px); height:clamp(52px,12.5vw,72px); border-radius:50%;
    border:4px solid #fff; background:#fffdf5; box-shadow:0 3px 8px rgba(60,30,0,.3);
    padding:0; cursor:pointer; }
  .stampBtn.sel { outline:5px solid #ffd23a; transform:scale(1.12); }
  .stampBtn canvas { width:100%; height:100%; border-radius:50%; display:block; }
  #paintDivider { width:3px; height:clamp(40px,9vw,54px); background:#f0c98a; border-radius:2px; }
  #doneBtn { font-family:inherit; font-size:clamp(17px,4.2vw,24px); font-weight:900; color:#fff; background:#3fae5a;
    border:none; border-radius:40px; padding:12px clamp(14px,3.4vw,26px); box-shadow:0 5px 0 #2a7a3e;
    cursor:pointer; letter-spacing:.06em; display:none; animation:pulse 1.1s ease-in-out infinite; }
  #doneBtn.show { display:block; }
  #doneBtn:active { transform:translateY(4px); box-shadow:0 1px 0 #2a7a3e; }
  @keyframes pulse { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }
  /* ---- ghost hand ---- */
  #hand { position:fixed; left:0; top:0; z-index:9; font-size:clamp(40px,9vw,58px); pointer-events:none;
    opacity:0; transition:opacity .4s; will-change:transform;
    filter:drop-shadow(0 0 14px rgba(255,220,120,.95)) drop-shadow(0 3px 6px rgba(0,0,0,.4)); }
  /* ---- intro ---- */
  #intro { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(#ffd98a 0%, #ffb066 45%, #f2836b 100%); transition:opacity .6s; }
  #intro.hide { opacity:0; pointer-events:none; }
  #intro h1 { color:#8a3b00; font-size:clamp(34px,9vw,64px); margin:0 0 8px; text-shadow:0 3px 0 #ffe9b8; letter-spacing:.08em;}
  #intro p { color:#a05515; font-size:clamp(15px,4vw,22px); margin:0 0 34px; font-weight:700;}
  #startBtn { font-family:inherit; font-size:clamp(24px,6vw,38px); font-weight:900; color:#fff; background:#ff4f66;
    border:none; border-radius:60px; padding:20px 58px; box-shadow:0 8px 0 #c22743, 0 14px 24px rgba(120,0,20,.35);
    cursor:pointer; animation:pulse 1.2s ease-in-out infinite; letter-spacing:.1em;}
  #startBtn:active { transform:translateY(6px); box-shadow:0 2px 0 #c22743; }
  #introLan { font-size:clamp(50px,14vw,90px); margin-bottom:6px; animation:sway 2.2s ease-in-out infinite; }
  @keyframes sway { 0%,100%{transform:rotate(-7deg);} 50%{transform:rotate(7deg);} }
  #mute { position:fixed; top:max(10px, env(safe-area-inset-top)); right:max(10px, env(safe-area-inset-right));
    z-index:11; width:46px; height:46px; border-radius:50%; border:3px solid #fff; background:rgba(0,0,0,.28);
    color:#fff; font-size:22px; cursor:pointer; display:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<div id="paintbar">
  <button class="colorBtn sel" data-color="#e6486f" style="background:#e6486f" aria-label="あか"></button>
  <button class="colorBtn" data-color="#2f6fbf" style="background:#2f6fbf" aria-label="あお"></button>
  <button class="colorBtn" data-color="#f5a91e" style="background:#f5a91e" aria-label="きいろ"></button>
  <div id="paintDivider"></div>
  <button class="stampBtn" data-design="hana" aria-label="はな"><canvas width="128" height="128"></canvas></button>
  <button class="stampBtn" data-design="sakana" aria-label="さかな"><canvas width="128" height="128"></canvas></button>
  <button class="stampBtn" data-design="hoshi" aria-label="ほし"><canvas width="128" height="128"></canvas></button>
  <button id="doneBtn">できた!</button>
</div>
<div id="hand">&#128070;</div>
<button id="mute" aria-label="おと">&#128266;</button>
<div id="intro">
  <div id="introLan">&#127982;</div>
  <h1>よまつりの じゅんび</h1>
  <p>ちょうちんを つくって まちを かざろう</p>
  <button id="startBtn">はじめる</button>
</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module" src="./main.js"></script>
</body>
</html>
