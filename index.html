<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>えいしゃぎしさん</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <!-- step progress (icons only, no text) -->
  <div id="hud">
    <div class="step" data-step="0"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="13" fill="none" stroke="currentColor" stroke-width="4"/><path d="M14 14 L10 10 M24 24 l6-6" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M37 9 l2 4 4 2 -4 2 -2 4 -2 -4 -4 -2 4 -2 z" fill="currentColor"/></svg></div>
    <div class="step" data-step="1"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="16" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="24" cy="24" r="4" fill="currentColor"/><circle cx="24" cy="13" r="3.4" fill="currentColor"/><circle cx="24" cy="35" r="3.4" fill="currentColor"/><circle cx="13" cy="24" r="3.4" fill="currentColor"/><circle cx="35" cy="24" r="3.4" fill="currentColor"/></svg></div>
    <div class="step" data-step="2"><svg viewBox="0 0 48 48"><path d="M6 24 h10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><rect x="16" y="16" width="12" height="16" rx="4" fill="currentColor"/><path d="M28 20 h8 M28 28 h8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></div>
    <div class="step" data-step="3"><svg viewBox="0 0 48 48"><path d="M6 24 C14 12 34 12 42 24 C34 36 14 36 6 24 z" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="24" cy="24" r="6" fill="currentColor"/></svg></div>
    <div class="step" data-step="4"><svg viewBox="0 0 48 48"><path d="M10 30 v-12 a6 6 0 0 1 12 0 v12" fill="none" stroke="currentColor" stroke-width="4"/><rect x="6" y="28" width="20" height="8" rx="3" fill="currentColor"/><path d="M34 12 v26 M30 38 h8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></div>
    <div class="step" data-step="5"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="14" fill="none" stroke="currentColor" stroke-width="4"/><path d="M20 17 l12 7 -12 7 z" fill="currentColor"/></svg></div>
  </div>

  <!-- during the show: switch reels / replay -->
  <div id="showui">
    <button class="reelbtn" data-reel="0" aria-label="umi"><span class="dot dot-a"></span></button>
    <button class="reelbtn" data-reel="1" aria-label="mori"><span class="dot dot-b"></span></button>
    <button class="reelbtn" data-reel="2" aria-label="sora"><span class="dot dot-c"></span></button>
    <button id="replay" aria-label="mou ichido"><svg viewBox="0 0 48 48"><path d="M38 24 a14 14 0 1 1 -5-10.7" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M34 4 l2 10 -10 1 z" fill="currentColor"/></svg></button>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
