<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#f4ede4" />
  <title>コロコロカプセル</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%23fff'/%3E%3Cpath d='M 6 32 A 26 26 0 0 0 58 32 Z' fill='%23f2a9c4'/%3E%3C/svg%3E" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      background: linear-gradient(175deg, #fdf6ec 0%, #f3ece2 38%, #e4ecea 74%, #d8e6e2 100%);
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    /* ---- result buttons (no text, big icons) ---- */
    #resultUI {
      position: fixed;
      left: 0; right: 0;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      display: flex;
      justify-content: center;
      gap: 34px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease, transform 0.45s ease;
      transform: translateY(24px);
      z-index: 10;
    }
    #resultUI.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .bigBtn {
      width: 104px; height: 104px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 8px 26px rgba(90, 80, 70, 0.28), inset 0 -4px 10px rgba(180,170,160,0.25);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.12s ease;
    }
    .bigBtn:active { transform: scale(0.9); }
    .bigBtn svg { width: 62px; height: 62px; }
    @media (max-height: 420px) {
      #resultUI { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
      .bigBtn { width: 84px; height: 84px; }
      .bigBtn svg { width: 50px; height: 50px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="resultUI">
    <button class="bigBtn" id="btnReplay" aria-label="もういちど">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M 50 32 A 18 18 0 1 1 41 16.4" stroke="#6bbfae" stroke-width="7" stroke-linecap="round"/>
        <path d="M 38 7 L 50 15 L 38 24 Z" fill="#6bbfae"/>
        <circle cx="32" cy="32" r="7.5" fill="#f2a9c4"/>
      </svg>
    </button>
    <button class="bigBtn" id="btnNew" aria-label="べつのカプセル">
      <svg viewBox="0 0 64 64" fill="none">
        <circle cx="30" cy="34" r="17" fill="#fff" stroke="#c9c2ba" stroke-width="2.5"/>
        <path d="M 13 34 A 17 17 0 0 0 47 34 Z" fill="#8fd0f2"/>
        <rect x="12" y="32.2" width="36" height="3.6" rx="1.8" fill="#e8e2da"/>
        <g stroke="#f5b53f" stroke-width="3.4" stroke-linecap="round">
          <path d="M 51 10 L 51 22"/><path d="M 45 16 L 57 16"/>
        </g>
      </svg>
    </button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
