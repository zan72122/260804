<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#241a52">
<title>にじいろ・グラスタワー</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<button id="btn-sound" class="icon-btn" aria-label="おと">
  <svg class="ic-on" viewBox="0 0 24 24" width="26" height="26"><path fill="#fff" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
  <svg class="ic-off" viewBox="0 0 24 24" width="26" height="26"><path fill="#fff" d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
</button>

<button id="btn-reset" class="icon-btn" aria-label="さいしょから">
  <svg viewBox="0 0 24 24" width="26" height="26"><path fill="#fff" d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-8 8s3.57 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
</button>

<button id="btn-replay" class="hidden" aria-label="もういっかい">
  <svg viewBox="0 0 24 24" width="54" height="54"><path fill="#fff" d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
</button>

<button id="btn-album" class="icon-btn" aria-label="アルバム">
  <svg viewBox="0 0 24 24" width="26" height="26">
    <rect x="3" y="3" width="14" height="14" rx="2" fill="#fff" opacity="0.35"/>
    <rect x="5.5" y="5.5" width="14" height="14" rx="2" fill="#fff" opacity="0.6"/>
    <rect x="8" y="8" width="14" height="14" rx="2" fill="#fff"/>
    <circle cx="12.3" cy="12.3" r="1.5" fill="#5b3fae"/>
    <path d="M9.5 21l3.6-4.2 2.5 2.8 2.1-2.4L22 21H9.5z" fill="#5b3fae"/>
  </svg>
  <span id="album-badge" class="badge hidden"></span>
</button>

<div id="palette" class="palette"></div>

<div id="album-overlay" class="hidden">
  <div id="album-grid"></div>
  <button id="album-close" aria-label="とじる">&#10005;</button>
</div>

<script src="js/color.js"></script>
<script src="js/liquid-art.js"></script>
<script src="js/audio.js"></script>
<script src="js/palette.js"></script>
<script src="js/album.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
