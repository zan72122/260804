<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Croquembouche</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a1a10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8D%AE%3C/text%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #201410; overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---- wordless restart affordance ---- */
  #again {
    position: fixed; left: 50%; bottom: calc(6vh + env(safe-area-inset-bottom));
    transform: translateX(-50%) scale(0.6);
    width: 88px; height: 88px; opacity: 0; pointer-events: none;
    transition: opacity .5s ease, transform .5s cubic-bezier(.2,1.4,.4,1);
    filter: drop-shadow(0 4px 14px rgba(0,0,0,.55));
  }
  #again.show { opacity: 1; transform: translateX(-50%) scale(1); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe {
    0%,100% { transform: translateX(-50%) scale(1); }
    50%     { transform: translateX(-50%) scale(1.09); }
  }

  /* ---- loading veil ---- */
  #veil {
    position: fixed; inset: 0; background: #201410;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .7s ease; z-index: 10;
  }
  #veil.gone { opacity: 0; pointer-events: none; }
  #veil .dot {
    width: 18px; height: 18px; margin: 0 7px; border-radius: 50%;
    background: #e8b063; animation: bob 1s ease-in-out infinite;
  }
  #veil .dot:nth-child(2) { animation-delay: .13s; }
  #veil .dot:nth-child(3) { animation-delay: .26s; }
  @keyframes bob { 0%,100% { transform: translateY(0); opacity:.5 } 50% { transform: translateY(-14px); opacity:1 } }
</style>
</head>
<body>
<div id="app"></div>

<!-- circular arrow = "one more tower" (no words, for 4 year olds) -->
<svg id="again" viewBox="0 0 100 100" aria-hidden="true">
  <circle cx="50" cy="50" r="46" fill="rgba(38,22,14,.72)" stroke="#f0c179" stroke-width="3"/>
  <path d="M50 24 A26 26 0 1 0 76 50" fill="none" stroke="#ffd79a" stroke-width="9"
        stroke-linecap="round"/>
  <path d="M40 15 L52 24 L40 33 Z" fill="#ffd79a"/>
</svg>

<div id="veil"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
  import { boot } from './src/game.js';
  boot(document.getElementById('app'));
</script>
</body>
</html>
