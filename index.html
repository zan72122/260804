<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fd0ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="4さいからの けんせつじゅうき 3D あそび。ショベルカーで つちを すくって、ロードローラーで どうろを つくろう。">
<title>どうろを つくろう ｜ ショベルカーと ロードローラー</title>
<link rel="stylesheet" href="./styles.css">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="どうろを つくろう">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffd23f'/%3E%3Cpath d='M12 46h40v6H12z' fill='%235b4636'/%3E%3Cpath d='M18 40l10-18 8 4-6 14z' fill='%23ff8c42'/%3E%3C/svg%3E">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>

<canvas id="scene"></canvas>
<div id="vignette" aria-hidden="true"></div>

<!-- ふきだし（オノマトペ）レイヤー -->
<div id="popups" aria-hidden="true"></div>

<!-- ゆびの ヒント -->
<div id="hint" class="hidden" aria-hidden="true">
  <div class="hint-ring"></div>
  <div class="hint-hand">👆</div>
</div>

<!-- じょうたい ひょうじ -->
<header id="hud" class="hidden">
  <div id="task" class="task-card">
    <span class="task-icon" id="taskIcon">🚜</span>
    <span class="task-text" id="taskText">つちを すくおう</span>
  </div>
  <div id="meter" class="meter">
    <div class="meter-fill" id="meterFill"></div>
    <span class="meter-icon" id="meterIcon">🚚</span>
  </div>
</header>

<!-- スタート がめん -->
<div id="start" class="overlay">
  <div class="start-inner">
    <div class="start-art">
      <span class="art-shovel">🚜</span>
      <span class="art-truck">🚚</span>
    </div>
    <h1 class="title">どうろを<br>つくろう</h1>
    <p class="subtitle">ゆびで うごかすよ</p>
    <button id="startBtn" class="big-btn" type="button">
      <span class="big-btn-icon">▶</span>
      <span class="big-btn-label">はじめる</span>
    </button>
  </div>
</div>

<!-- クリア がめん -->
<div id="clear" class="overlay hidden">
  <div class="start-inner">
    <div class="clear-art">🎉</div>
    <h1 class="title">できた！</h1>
    <p class="subtitle">きれいな どうろだね</p>
    <button id="againBtn" class="big-btn" type="button">
      <span class="big-btn-icon">↻</span>
      <span class="big-btn-label">もういちど</span>
    </button>
  </div>
</div>

<!-- ちいさな おとの ボタン -->
<button id="soundBtn" class="corner-btn hidden" type="button" aria-label="おと">🔊</button>

<noscript><p style="padding:2rem;font:16px sans-serif">JavaScript を オンに してください。</p></noscript>

<script type="module" src="./src/main.js"></script>
</body>
</html>
