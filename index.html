<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060f">
<title>あわせて！くらくして！ ほしぞらドーム</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23090a1a'/%3E%3Ctext y='46' x='32' text-anchor='middle' font-size='38'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="stage"></canvas>
<div id="vignette"></div>

<div id="ui">

  <!-- ================= タイトル ================= -->
  <section id="title" class="screen show">
    <div class="title-glow"></div>
    <h1 class="title-main">
      <span class="tline t1">あわせて！</span>
      <span class="tline t2">くらくして！</span>
      <span class="tline t3">ほしぞらドーム</span>
    </h1>
    <button id="startBtn" class="big-round">
      <span class="br-ring"></span>
      <span class="br-face">
        <span class="br-icon">✦</span>
        <span class="br-label">はじめる</span>
      </span>
    </button>
    <p class="title-sub">ゆびで あそべるよ</p>
  </section>

  <!-- ================= 進行ランプ ================= -->
  <div id="lamps" class="hidden">
    <i data-step="0"></i><i data-step="1"></i><i data-step="2"></i><i data-step="3"></i><i data-step="4"></i>
  </div>

  <!-- ================= ヒント ================= -->
  <div id="hint" class="hidden"><span id="hintIcon">👆</span><span id="hintText"></span></div>

  <!-- ================= 作業パネル ================= -->
  <section id="panel" class="hidden">

    <!-- STEP 1 : レンズみがき -->
    <div class="task" id="task-lens">
      <div class="lens-wrap">
        <div class="lens-body">
          <canvas id="fogCanvas" width="300" height="300"></canvas>
          <div class="lens-glass"></div>
          <div class="lens-ring"></div>
          <div class="lens-shine"></div>
        </div>
        <div class="lens-sparkles" id="lensSparkles"></div>
      </div>
    </div>

    <!-- STEP 2 : ディスクえらび -->
    <div class="task" id="task-disc">
      <div class="slot" id="discSlot">
        <div class="slot-mouth"></div>
        <div class="slot-glow"></div>
        <div class="slot-arrow">▼</div>
      </div>
      <div class="disc-rack" id="discRack"></div>
    </div>

    <!-- STEP 3 : わくせいあわせ -->
    <div class="task" id="task-planet">
      <div class="tracks" id="planetTracks"></div>
    </div>

    <!-- STEP 4 : ケーブル -->
    <div class="task" id="task-cable">
      <svg id="cableSvg" preserveAspectRatio="none"></svg>
      <div class="sockets" id="sockets"></div>
      <div class="plugs" id="plugs"></div>
    </div>

    <!-- STEP 5 : レバー -->
    <div class="task" id="task-lever">
      <div class="lever-frame">
        <div class="lever-slot"></div>
        <div class="lever-marks"><span>ON</span><span>OFF</span></div>
        <div class="lever-knob" id="leverKnob">
          <div class="lk-grip"></div>
          <div class="lk-light"></div>
        </div>
        <div class="lever-arrow" id="leverArrow">▼</div>
      </div>
    </div>

  </section>

  <!-- ================= フィナーレ後 ================= -->
  <div id="afterglow" class="hidden">
    <div id="figureName"></div>
  </div>

  <div id="replay" class="hidden">
    <button id="againBtn" class="pill"><span>✦</span>もういっかい</button>
    <button id="themeBtn" class="pill ghost"><span>◎</span>ちがう ほしぞら</button>
  </div>

  <div id="flash"></div>
</div>

<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/themes.js"></script>
<script src="js/glcore.js"></script>
<script src="js/scene.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
