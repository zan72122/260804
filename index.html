<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>クルッ！スルスル！ひかる標本ラボ</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="うすい切片をつくって、水にうかべて、さいごに光る標本をみるゲーム。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0d14'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2354e0c8' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23ff6fd8'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #06080c;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN",
          "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
      }
      body { position: fixed; inset: 0; }
      #app { position: absolute; inset: 0; }
      #gl { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
      #ui { position: absolute; inset: 0; pointer-events: none; }

      /* --- boot / loading --- */
      #boot {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 26px;
        background: radial-gradient(120% 90% at 50% 40%, #16202e 0%, #070a10 70%);
        transition: opacity .55s ease; z-index: 20;
      }
      #boot.hide { opacity: 0; pointer-events: none; }
      #bootRing { width: 148px; height: 148px; }
      #bootRing .spin { transform-origin: 50% 50%; animation: spin 2.6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #bootTitle {
        color: #eaf6ff; font-size: clamp(18px, 5.2vw, 30px); font-weight: 800;
        letter-spacing: .06em; text-shadow: 0 2px 20px rgba(84,224,200,.35);
      }
      #bootTap { color: #9fd8ea; font-size: clamp(13px, 3.6vw, 18px); font-weight: 700;
        opacity: .9; animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:.45} 50%{opacity:1} }

      /* --- round icon buttons --- */
      .rbtn {
        position: absolute; pointer-events: auto;
        width: 62px; height: 62px; border-radius: 50%;
        border: 2px solid rgba(180, 232, 255, .32);
        background: rgba(14, 22, 32, .48);
        backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        display: flex; align-items: center; justify-content: center;
        transition: transform .16s ease, opacity .3s ease, background .2s ease;
        opacity: 0; transform: scale(.7);
      }
      .rbtn.on { opacity: 1; transform: scale(1); }
      .rbtn:active { transform: scale(.9); background: rgba(40, 70, 92, .6); }
      #btnSound { top: calc(var(--safe-t) + 10px); right: calc(var(--safe-r) + 10px); }
      #btnAgain {
        left: 50%; bottom: calc(var(--safe-b) + 26px); margin-left: -52px;
        width: 104px; height: 104px;
        border-color: rgba(255, 214, 120, .55);
        background: rgba(38, 28, 16, .55);
        box-shadow: 0 0 34px rgba(255, 190, 90, .3);
      }
      /* Held sideways the eyepiece circle fills the middle of the screen, so
         the replay button moves out of it rather than sitting on the payoff. */
      @media (orientation: landscape) {
        #btnAgain {
          left: auto; margin-left: 0;
          right: calc(var(--safe-r) + 18px);
          bottom: calc(var(--safe-b) + 18px);
          width: 88px; height: 88px;
        }
        #btnAgain svg { width: 52px; height: 52px; }
      }
      #btnAgain svg { width: 62px; height: 62px; }
      #btnSound svg { width: 32px; height: 32px; }
      #fallback {
        position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
        padding: 32px; text-align: center; color: #cfe6f2; font-size: 16px; line-height: 1.8;
        background: #0a0e14; z-index: 40;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="ui">
        <button id="btnSound" class="rbtn" aria-label="おと"></button>
        <button id="btnAgain" class="rbtn" aria-label="もういちど">
          <svg viewBox="0 0 48 48" fill="none" stroke="#ffd98a" stroke-width="4"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M40 24a16 16 0 1 1-4.7-11.3" />
            <path d="M38 6v9h-9" />
          </svg>
        </button>
      </div>
      <div id="boot">
        <svg id="bootRing" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="34" stroke="rgba(120,200,220,.18)" stroke-width="6" />
          <g class="spin">
            <circle cx="50" cy="50" r="34" stroke="#54e0c8" stroke-width="6"
                    stroke-linecap="round" stroke-dasharray="40 174" />
          </g>
          <circle cx="50" cy="50" r="9" fill="#ff6fd8" opacity=".85" />
        </svg>
        <div id="bootTitle">ひかる標本ラボ</div>
        <div id="bootTap">よみこみちゅう…</div>
      </div>
      <div id="fallback">
        このゲームには WebGL が必要です。<br />ブラウザを最新にしてから、もう一度ひらいてね。
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
