<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>はねばし キャナルタウン</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<style>
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;
      -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { width:100%; height:100%; overflow:hidden; position:fixed; background:#0e2436;
      font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", "Rounded Mplus 1c", sans-serif; }
  #app { position:fixed; inset:0; touch-action:none; }
  canvas { display:block; }

  /* ---------- UI overlay ---------- */
  #ui { position:fixed; inset:0; pointer-events:none; z-index:5; }

  #hint {
    position:absolute; left:50%; transform:translateX(-50%);
    top: calc(var(--safe-top) + 12px);
    max-width:92%;
    background:rgba(255,252,240,.94); color:#4a3520;
    border:3px solid #f7b32b; border-radius:26px;
    padding:10px 22px; font-size: clamp(19px, 4.6vw, 30px); font-weight:800;
    text-align:center; line-height:1.35; white-space:pre-line; word-break:keep-all;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    transition: opacity .35s, transform .35s; opacity:0; transform:translateX(-50%) translateY(-12px);
  }
  #hint.show { opacity:1; transform:translateX(-50%) translateY(0); }

  #stars {
    position:absolute; left:50%; transform:translateX(-50%);
    bottom: calc(var(--safe-bottom) + 10px);
    display:flex; gap:7px;
    background:rgba(20,40,58,.55); border-radius:20px; padding:7px 14px;
    backdrop-filter: blur(4px);
    transition: opacity .4s;
  }
  #stars .st { font-size: clamp(20px,4.5vw,30px); filter:grayscale(1) opacity(.45); transition: filter .3s, transform .3s; }
  #stars .st.on { filter:none; transform:scale(1.15); text-shadow:0 0 12px #ffd75e; }
  #stars.hidden { opacity:0; }

  /* ---------- title ---------- */
  #title {
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4vh; text-align:center;
    background:radial-gradient(ellipse at 50% 35%, rgba(30,70,100,.28), rgba(8,20,32,.78));
    transition: opacity .6s; cursor:pointer;
  }
  #title.hide { opacity:0; pointer-events:none; }
  #title h1 {
    color:#fff; font-size:clamp(34px, 9vw, 64px); font-weight:900; letter-spacing:.06em;
    text-shadow: 0 4px 0 #b05e18, 0 10px 30px rgba(0,0,0,.6);
    -webkit-text-stroke: 2px #7a3d0c; paint-order: stroke fill;
  }
  #title p { color:#ffe9b8; font-size:clamp(16px,4.2vw,24px); font-weight:700; text-shadow:0 2px 8px rgba(0,0,0,.7); }
  #tapstart {
    background:linear-gradient(#ffd75e,#f7a11b); color:#5a3200;
    font-size:clamp(22px,6vw,34px); font-weight:900;
    padding:16px 44px; border-radius:999px; border:4px solid #fff;
    box-shadow:0 8px 24px rgba(0,0,0,.45), inset 0 -5px 0 rgba(0,0,0,.15);
    animation: pump 1.2s ease-in-out infinite;
  }
  @keyframes pump { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }

  #err { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
         color:#fff; font-size:18px; padding:30px; text-align:center; background:#122; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="ui">
    <div id="hint"></div>
    <div id="stars">
      <span class="st">⭐</span><span class="st">⭐</span><span class="st">⭐</span>
      <span class="st">⭐</span><span class="st">⭐</span><span class="st">⭐</span>
    </div>
  </div>
  <div id="title">
    <h1>はねばし<br>キャナルタウン</h1>
    <p>おおきな はねばしを うごかして<br>ふねを とおしてあげよう！</p>
    <div id="tapstart">タップして はじめる</div>
  </div>
  <div id="err"></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
