      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #6f95ae;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      /* Cinematic framing: soft vignette + warm bloom-ish lift, done in CSS so
         it costs nothing on a phone GPU. */
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(
            120% 90% at 50% 42%,
            rgba(255, 246, 224, 0.1) 0%,
            rgba(255, 240, 214, 0) 42%,
            rgba(24, 30, 44, 0.16) 82%,
            rgba(16, 22, 34, 0.36) 100%
          );
        mix-blend-mode: multiply;
        opacity: 0.92;
      }
      #grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.05;
        background-image: var(--grain);
        background-size: 180px 180px;
      }
      #hint-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #a9cbe0 0%, #dcd0b4 100%);
        transition: opacity 0.7s ease;
        z-index: 10;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot .mark {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        border: 5px solid rgba(255, 255, 255, 0.55);
        border-top-color: rgba(126, 78, 44, 0.85);
        animation: spin 1.05s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
