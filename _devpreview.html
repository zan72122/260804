<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>A6 dev preview</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#0a0a12;overflow:hidden;}
  #app{position:relative;width:100vw;height:100vh;}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #hud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  #hud>*{pointer-events:auto;}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="hud"></div>
</div>
<pre id="err" style="position:absolute;z-index:9999;color:red;background:#fff;font-size:10px;max-width:100%;white-space:pre-wrap;"></pre>
<script>
  window.addEventListener('error', (e) => { document.getElementById('err').textContent += 'ERR: ' + e.message + '\n'; });
  window.addEventListener('unhandledrejection', (e) => { document.getElementById('err').textContent += 'REJ: ' + e.reason + '\n'; });
</script>
<script type="module">
  import { createInitialState } from '/src/core/state.ts';
  import { bus } from '/src/core/events.ts';
  import { hud } from '/src/ui/hud.ts';
  import { mechanic } from '/src/render/mechanic.ts';
  import { effects } from '/src/render/effects.ts';
  import { createFault } from '/src/sim/faults.ts';

  const params = new URLSearchParams(location.search);
  const state = createInitialState();
  state.phase = params.get('phase') || 'title';
  state.mode = params.get('mode') || 'play';
  state.testRunStage = Number(params.get('testRunStage') || '0');
  state.location = Number(params.get('location') || '0');
  state.settings.reducedMotion = params.get('reduced') === '1';
  if (params.get('fault')) {
    state.fault = createFault(params.get('fault'), state.escalator);
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();

  hud.init(state);

  if (params.get('hint') === '1') {
    bus.emit('hint', { x: 40, y: -120 });
  }
  if (params.get('celebrate') === '1') {
    bus.emit('celebrate', {});
  }
  if (params.get('burst')) {
    effects.burst(0, -150, params.get('burst'));
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    state.time += dt;
    mechanic.update(dt, state);
    effects.update(dt);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#ffe9de';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.translate(canvas.width / 2, canvas.height / 2 - 60);
    ctx.scale(1, 1);
    ctx.translate(0, 150);

    const model = state.escalator;
    ctx.save();
    ctx.strokeStyle = '#8892a0';
    ctx.lineWidth = 6;
    ctx.beginPath();
    for (let i = 0; i <= 40; i++) {
      const p = model.pathPoint(i / 40);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = 'red';
    ctx.fillRect(-5, -5, 10, 10);

    mechanic.render(ctx, state);
    effects.render(ctx, state);

    hud.sync(state);
    document.getElementById('err').textContent = 'time=' + state.time.toFixed(2) + ' phase=' + state.phase;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
